<!DOCTYPE html>
<html>
    <head>
        <title>Bunni</title>

        <link rel="stylesheet" type="text/css" href="bunni.css">

        <style>
            .drag{
                position: relative;
                cursor: move;
                user-select: none;
            }
        </style>

        <script>
            function toggleStart() {
                const button = document.getElementById("bunniButton");
                const content = document.getElementById("mainContent");
                const audio = document.getElementById("bunniAudio");
                const body = document.body

                if (button.onclick) {
                    button.style.display = "none";
                }

                if (content.style.display === "none") {
                    content.style.display = "block";
                } else {
                    content.style.display = "none";
                }

                if (audio.muted) {
                    audio.muted = false
                    audio.play();
                }

                body.style.backgroundImage = "url('bunni_items/normal_images/sparkle.gif')";
                body.style.backgroundSize = "cover";
            }
        </script>

        <script>
            function togglePause() {
                const audio = document.getElementById("bunniAudio");
                const btn = document.getElementById("pauseBtn");

                if (audio.muted) {
                    audio.muted = false;    
                    audio.play();
                    btn.innerHTML = "Pause";
                } else {
                    audio.muted = true;
                    audio.pause();
                    btn.innerHTML = "Play";
                }
            }
        </script>
    </head>
    <body>
        <div class="center">
            <button id="bunniButton" class="bunniButton" onClick="toggleStart()">bunni</button>
        </div>

        <div id="mainContent" style="display: none">
            <button class="pause" id="pauseBtn" onClick="togglePause()">Pause</button>
            <img class="drag" src="bunni_items/bunni_images/bunni1.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 50px; left: 50px;"> <!-- bunni img 1 -->
            <img class="drag" src="bunni_items/bunni_images/bunni2.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 75px; right: 25px;"> <!-- bunni img 2 -->
            <img class="drag" src="bunni_items/bunni_images/bunni3.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 100px; left: 500px;"> <!-- bunni img 3 -->
            <img class="drag" src="bunni_items/bunni_images/bunni4.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 30px; left: 520px;"> <!-- bunni img 4 -->
            <img class="drag" src="bunni_items/bunni_images/bunni5.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 750px; right: 570px;"> <!-- bunni img 5 -->
            <img class="drag" src="bunni_items/bunni_images/bunni6.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 503px; left: 430px;"> <!-- bunni img 6 -->
            <img class="drag" src="bunni_items/bunni_images/bunni7.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 350px; left: 50px;"> <!-- bunni img 7 -->
            <img class="drag" src="bunni_items/bunni_images/bunni8.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 75px; right: 50px;"> <!-- bunni img 8 -->
            <img class="drag" src="bunni_items/bunni_images/bunni9.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 50px; left: 502px;"> <!-- bunni img 9 -->
            <img class="drag" src="bunni_items/bunni_images/bunni10.jpg" width="35%" height="35%" draggable="false" style="position: absolute; top: 600px; right: 501px;"> <!-- bunni img 10 -->
        </div>

        <script>
            document.querySelectorAll('.drag').forEach(img => {
            let isDragging = false;
            let startX, startY;
            let currentX = 0;
            let currentY = 0;

            img.addEventListener('mousedown', (e) => {
                e.preventDefault(); 
                isDragging = true;

                startX = e.clientX - currentX;
                startY = e.clientY - currentY;

                document.addEventListener('mousemove', mouseMoveHandler);
                document.addEventListener('mouseup', mouseUpHandler);
            });

            function mouseMoveHandler(e) {
                if (!isDragging) return;

                currentX = e.clientX - startX;
                currentY = e.clientY - startY;

                img.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
            }

            function mouseUpHandler() {
                isDragging = false;

                document.removeEventListener('mousemove', mouseMoveHandler);
                document.removeEventListener('mouseup', mouseUpHandler);
            }
            });
        </script>

        <audio id="bunniAudio" autoplay loop muted>
            <source src="bunni.mp3" type="audio/mpeg">
        </audio>
    </body>
</html>
